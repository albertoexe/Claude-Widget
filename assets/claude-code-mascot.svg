<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <!-- Orange 8-bit robot mascot — Claude Code style -->
  <!-- Each pixel = 8×8. 16×16 grid. #F07030=orange body, #1A0800=outline, #FFFFF5=eyes -->

  <!-- top head border -->
  <rect fill="#1A0800" x="32" y="8"   width="64" height="8"/>

  <!-- head row 2 -->
  <rect fill="#1A0800" x="24" y="16"  width="8"  height="8"/>
  <rect fill="#F07030" x="32" y="16"  width="64" height="8"/>
  <rect fill="#1A0800" x="96" y="16"  width="8"  height="8"/>

  <!-- head row 3 (widest) -->
  <rect fill="#1A0800" x="16" y="24"  width="8"  height="8"/>
  <rect fill="#F07030" x="24" y="24"  width="80" height="8"/>
  <rect fill="#1A0800" x="104" y="24" width="8"  height="8"/>

  <!-- eyes row 4 -->
  <rect fill="#1A0800" x="16" y="32"  width="8"  height="8"/>
  <rect fill="#F07030" x="24" y="32"  width="16" height="8"/>
  <rect fill="#FFFFF5" x="40" y="32"  width="16" height="8"/>
  <rect fill="#F07030" x="56" y="32"  width="16" height="8"/>
  <rect fill="#FFFFF5" x="72" y="32"  width="16" height="8"/>
  <rect fill="#F07030" x="88" y="32"  width="16" height="8"/>
  <rect fill="#1A0800" x="104" y="32" width="8"  height="8"/>

  <!-- eyes row 5 -->
  <rect fill="#1A0800" x="16" y="40"  width="8"  height="8"/>
  <rect fill="#F07030" x="24" y="40"  width="16" height="8"/>
  <rect fill="#FFFFF5" x="40" y="40"  width="16" height="8"/>
  <rect fill="#F07030" x="56" y="40"  width="16" height="8"/>
  <rect fill="#FFFFF5" x="72" y="40"  width="16" height="8"/>
  <rect fill="#F07030" x="88" y="40"  width="16" height="8"/>
  <rect fill="#1A0800" x="104" y="40" width="8"  height="8"/>

  <!-- face row 6 -->
  <rect fill="#1A0800" x="16" y="48"  width="8"  height="8"/>
  <rect fill="#F07030" x="24" y="48"  width="80" height="8"/>
  <rect fill="#1A0800" x="104" y="48" width="8"  height="8"/>

  <!-- mouth row 7 -->
  <rect fill="#1A0800" x="16" y="56"  width="8"  height="8"/>
  <rect fill="#F07030" x="24" y="56"  width="24" height="8"/>
  <rect fill="#1A0800" x="48" y="56"  width="32" height="8"/>
  <rect fill="#F07030" x="80" y="56"  width="24" height="8"/>
  <rect fill="#1A0800" x="104" y="56" width="8"  height="8"/>

  <!-- face row 8 -->
  <rect fill="#1A0800" x="16" y="64"  width="8"  height="8"/>
  <rect fill="#F07030" x="24" y="64"  width="80" height="8"/>
  <rect fill="#1A0800" x="104" y="64" width="8"  height="8"/>

  <!-- head narrows row 9 -->
  <rect fill="#1A0800" x="24" y="72"  width="8"  height="8"/>
  <rect fill="#F07030" x="32" y="72"  width="64" height="8"/>
  <rect fill="#1A0800" x="96" y="72"  width="8"  height="8"/>

  <!-- bottom head border -->
  <rect fill="#1A0800" x="32" y="80"  width="64" height="8"/>

  <!-- legs rows 11-12 -->
  <rect fill="#F07030" x="32" y="88"  width="16" height="16"/>
  <rect fill="#F07030" x="80" y="88"  width="16" height="16"/>

  <!-- feet row 13 -->
  <rect fill="#1A0800" x="32" y="104" width="16" height="8"/>
  <rect fill="#1A0800" x="80" y="104" width="16" height="8"/>
</svg>
